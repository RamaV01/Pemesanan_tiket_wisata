<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Pemesanan Tiket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pemesanan Tiket</h1>
    <nav>
      <ul>
        <li><a href="index.html">Kembali</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <form id="orderForm">
      <section>
        <h3>Data Pribadi</h3>
        <h4>Data umum</h4>
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="masukkan nama lengkap">
        </div>
        
        <div class="form-group">
          <label>Alamat Rumah</label>
          <textarea id="alamat" name="alamat" placeholder="cantumkan alamat"></textarea>
        </div>
        
        <div class="form-group">
          <label for="desa">Desa / Kelurahan :</label>
          <select name="desa" id="desa">
            <option value="Cipada">Cipada</option>
            <option value="Jambudipa">Jambudipa</option>
            <option value="Kertawangi">Kertawangi</option>
            <option value="Padaasih">Padaasih</option>
            <option value="Pasirhalang">Pasirhalang</option>
            <option value="Pasirlangu">Pasirlangu</option>
            <option value="Sadangmekar">Sadangmekar</option>
            <option value="Tugumukti">Tugumukti</option>
          </select>
        </div>
        <div class="form-group">
          <label for="kecamatan">Kecamatan :</label>
          <select name="kecamatan" id="kecamatan">
            <option value="Batujajar">Batujajar</option>
            <option value="Cihampelas">Cihampelas</option>
            <option value="Cikalongwetan">Cikalongwetan</option>
            <option value="Cililin">Cililin</option>
            <option value="Cipatat">Cipatat</option>
            <option value="Cipeundeuy">Cipeundeuy</option>
            <option value="Cipongkor">Cipongkor</option>
            <option value="Cisarua">Cisarua</option>
          </select>
        </div>
        <div class="form-group">
          <label for="kab">Kabupaten / Kota :</label>
          <select name="kab" id="kab">
            <option value="Kabupaten Bandung">Kabupaten Bandung</option>
            <option value="Kabupaten Bandung Barat">Kabupaten Bandung Barat</option>
            <option value="Kabupaten Bogor">Kabupaten Bogor</option>
            <option value="Kabupaten Bekasi">Kabupaten Bekasi</option>
            <option value="Kabupaten Cianjur">Kabupaten Cianjur</option>
            <option value="Kota Bandung">Kota Bandung</option>
            <option value="Kota Banjar">Kota Banjar</option>
            <option value="Kota Bogor">Kota Bogor</option>
            <option value="Kota Bekasi">Kota Bekasi</option>
            <option value="Kota Cimahi">Kota Cimahi</option>
          </select>
        </div>
        <div class="form-group">
          <label for="prov">Provinsi:</label>
          <select name="prov" id="prov">
            <option value="Provinsi Bali">Provinsi Bali</option>
            <option value="Provinsi Banten">Provinsi Banten</option>
            <option value="Provinsi DI Yogyakarta">Provinsi DI Yogyakarta</option>
            <option value="Provinsi DKI Jakarta">Provinsi DKI Jakarta</option>
            <option value="Provinsi Lampung">Provinsi Lampung</option>
            <option value="Provinsi Jawa Barat">Provinsi Jawa Barat</option>
            <option value="Provinsi Jawa Tengah">Provinsi Jawa Tengah</option>
            <option value="Provinsi Jawa Timur">Provinsi Jawa Timur</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Status Kependudukan</label>
          <input type="radio" id="status" name="status">WNI
          <input type="radio" id="status" name="status">WNA
        </div>
      
        <h4>Data digital</h4>
        <div class="form-group">
          <label>Nomor Telepon</label>
          <input type="tel" id="telepon" name="telepon" placeholder="cantumkan alamat yang benar" required>
        </div>
        
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" name="email" placeholder="masukkan alamat email" required>
        </div>
        
        <div class="form-group">
          <label>Buat Password</label>
          <input type="password" id="pass" name="pass" placeholder="buat password yang unik" required>
        </div>
      </section>
      
      <section>
        <h3>Pesan Tiket</h3>
        <div class="form-group">
          <label>Jumlah Tiket</label>
          <input type="number" id="jumlah" name="jumlah" min="1" max="1500">
        </div>
        
        <div class="form-group">
          <label>Tanggal Keberangkatan</label>
          <input type="date" id="tanggal" name="tanggal">
        </div>
        
        <div class="form-group">
          <label>Rencana Waktu</label>
          <input type="time" id="waktu" name="waktu">
        </div>
        
        <div class="form-group">
          <label>Metode Pembayaran</label>
          <input type="radio" id="pembayaran" value="bank">BANK
          <input type="radio" id="pembayaran" value="e-wallet">E-Wallet
        </div>
      </section>
      
      <section>
          <h3>Jasa Tambahan</h3>
          <div class="form-group">
            <label>Penjemputan</label>
            <input type="checkbox" name="addon" value="jemput">
          </div>
          
          <div class="form-group">
            <label>Pemandu wisata</label>
            <input type="checkbox" name="addon" value="pemandu">
          </div>
          
          <div class="form-group">
            <label>Baju Serasi</label>
            <input type="checkbox" name="addon" value="warna_baju">
            <input type="color">
          </div>
      </section>
      
      <section>
        <div>
          <input type="reset" value="kosongkan">
          <input type="submit" value="Beli">
        </div>
      </section>
    </form>
    
    <div id="result" style="margin-top: 20px; padding: 15px; background: #A8FBD3; display: none;">
        <h3>Data Berhasil Disimpan!</h3>
        <p id="displayData"></p>
    </div>
  </main>
  
  <script>
    document.getElementById('orderForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Mencegah reload halaman

        // 1. Mengambil data menggunakan FormData
        const formData = new FormData(this);
        const dataObj = {};

        // Penanganan khusus untuk checkbox (karena bisa pilih lebih dari satu)
        const addons = formData.getAll('addon');

        // 2. Memproses data menjadi Object agar mudah disimpan
        formData.forEach((value, key) => {
            // Jika kuncinya adalah 'addon', kita masukkan array yang sudah diproses di atas
            if (key === 'addon') {
                dataObj[key] = addons;
            } else if (value instanceof File) {
                dataObj[key] = value.name ? value.name : "Tidak ada file";
            } else {
                dataObj[key] = value;
            }
        });

        // 3. Menyimpan ke LocalStorage (Simulasi Database di Browser)
        // Data ini akan tetap ada meskipun browser ditutup
        localStorage.setItem('pesananTerakhir', JSON.stringify(dataObj));

        // 4. Membuat tampilan output yang lebih cantik
        let outputHtml = '<ul style="list-style: none; padding: 0;">';
        for (const [key, value] of Object.entries(dataObj)) {

            const label = key.replace('_', ' ').toUpperCase();
            outputHtml += `<li style="margin-bottom: 5px; border-bottom: 1px solid grey; padding-bottom: 5px;">
                            <strong>${label}:</strong> ${Array.isArray(value) ? value.join(', ') : value}
                          </li>`;
        }
        outputHtml += '</ul>';
        
        const resultDiv = document.getElementById('result');
        const displayData = document.getElementById('displayData');

        displayData.innerHTML = outputHtml;
        resultDiv.style.display = 'block';

        resultDiv.scrollIntoView({ behavior: 'smooth' });

        alert("Halo " + dataObj.nama + ", data pesanan Anda telah disimpan di sistem lokal!");
    });

    window.addEventListener('load', () => {
        const savedData = localStorage.getItem('pesananTerakhir');
        if (savedData) {
            console.log("Data pesanan terakhir ditemukan:", JSON.parse(savedData));
        }
    });
  </script>
</body>
</html>
